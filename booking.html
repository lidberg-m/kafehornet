<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Boka bord</title>
  </head>
  <body>
    <h1>Boka bord</h1>
    <p>
      Fyll i formuläret så bekräftar vi via e-post inom en timme under öppettid.
      Sällskap över 8 personer: ring oss.
    </p>
    <p>
      <label for="name">Namn</label>
      <input type="text" id="name" />
    </p>
    <p>
      <label for="email">E-post</label>
      <input type="email" id="email" />
    </p>
    <p>
      <label for="date">Datum</label>
      <input type="date" id="date" />
    </p>
    <p>
      <label for="time">Tid</label>
      <input type="time" id="time" />
    </p>
    <p>
      <label for="count">Antal personer</label>
      <input type="number" id="count" />
    </p>
    <p>
      <label for="message">Meddelande (frivilligt)</label>
      <textarea id="message"></textarea>
    </p>
    <h2>Bra att veta</h2>
    <ul>
      <li>Bordet hålls i 15 minuter efter bokad tid.</li>
      <li>Vi har barnstolar och plats för barnvagn.</li>
      <li>Hundar är välkomna på uteserveringen.</li>
    </ul>
  </body>
</html>
